<main class="tela">
  <form class="card cartao" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <img class="logo" src="logo.webp" alt="Vittalis Pet, plano de saúde" />
    <div>
      <h1>Entrar</h1>
      <p class="sub">Use o e-mail e a senha da clínica.</p>
    </div>

    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" class="inp" type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="erro">Informe o e-mail.</small>
      }
    </div>

    <div class="field">
      <label for="senha">Senha</label>
      <input id="senha" class="inp" type="password" formControlName="senha" autocomplete="current-password" />
      @if (form.controls.senha.touched && form.controls.senha.invalid) {
        <small class="erro">Informe a senha.</small>
      }
    </div>

    @if (erro(); as mensagem) {
      <p class="alert" role="alert">{{ mensagem }}</p>
    }

    <button type="submit" class="btn btn-primary btn-block" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</main>
