<main class="tela">
  <form class="cartao" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <h1>Vittalis Pet</h1>
    <p class="sub">Entre com o e-mail e a senha da clínica.</p>

    <div class="campo">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="erro-campo">Informe o e-mail.</small>
      }
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" type="password" formControlName="senha" autocomplete="current-password" />
      @if (form.controls.senha.touched && form.controls.senha.invalid) {
        <small class="erro-campo">Informe a senha.</small>
      }
    </div>

    @if (erro(); as mensagem) {
      <p class="alerta" role="alert">{{ mensagem }}</p>
    }

    <button type="submit" class="primario" [disabled]="enviando()">
      {{ enviando() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>
</main>
